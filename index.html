<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DisplayWolf Dashboard Pro</title>
  <style>
    :root {
      --bg-color: #09090b;
      --card-bg: #18181b;
      --accent-color: #0284c7;
      --accent-glow: #38bdf8;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --danger: #ef4444;
      --success: #22c55e;
      --border-color: #27272a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      padding: 15px 10px;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Header e Stato */
    header {
      background: var(--card-bg);
      padding: 14px 16px;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--text-main);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      background: #000;
      padding: 6px 10px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--danger);
      box-shadow: 0 0 8px var(--danger);
    }

    .status-dot.connected {
      background-color: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    .status-dot.reconnecting {
      background-color: #f59e0b;
      box-shadow: 0 0 8px #f59e0b;
    }

    .btn-icon {
      background: #27272a;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 0.8rem;
      color: var(--text-main);
      cursor: pointer;
    }

    /* Pulsanti di Connessione */
    .btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      background: var(--accent-color);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      background: var(--border-color);
      color: var(--text-muted);
      cursor: not-allowed;
      transform: none;
    }

    .btn-danger {
      background: #3f3f46;
      color: var(--text-main);
    }

    .btn-warning {
      background: #b91c1c;
      color: #fff;
    }

    .btn-secondary {
      background: #27272a;
      border: 1px solid var(--border-color);
      color: var(--text-main);
    }

    /* Sezione Lap Timer (Best / Last Lap) */
    .lap-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;
    }

    .lap-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 12px;
      text-align: center;
      position: relative;
    }

    .lap-card.best {
      border-color: rgba(34, 197, 94, 0.4);
      background: linear-gradient(180deg, rgba(34, 197, 94, 0.05) 0%, var(--card-bg) 100%);
    }

    .lap-label {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .lap-card.best .lap-label {
      color: var(--success);
    }

    .lap-value {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text-main);
      margin-top: 4px;
      font-variant-numeric: tabular-nums;
    }

    .lap-card.best .lap-value {
      color: var(--success);
    }

    /* Card Angolo di Piega Visuale */
    .gauge-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 20px 16px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .gauge-title {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .visual-gauge-container {
      position: relative;
      width: 200px;
      height: 110px;
      margin-top: 10px;
    }

    .gauge-arc-bg {
      width: 200px;
      height: 100px;
      border-top-left-radius: 100px;
      border-top-right-radius: 100px;
      border: 12px solid #27272a;
      border-bottom: none;
      box-sizing: border-box;
    }

    .gauge-needle {
      position: absolute;
      bottom: 10px;
      left: 50%;
      width: 4px;
      height: 80px;
      background: var(--accent-glow);
      border-radius: 2px;
      transform-origin: bottom center;
      transform: translateX(-50%) rotate(0deg);
      transition: transform 0.15s cubic-bezier(0.1, 0.9, 0.2, 1);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .gauge-center-dot {
      position: absolute;
      bottom: 2px;
      left: 50%;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--text-main);
      transform: translateX(-50%);
    }

    .gauge-value-container {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 2px;
      margin-top: 5px;
    }

    .gauge-value {
      font-size: 3.8rem;
      font-weight: 900;
      color: var(--accent-glow);
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .gauge-unit {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--accent-glow);
    }

    /* Sezione Max SX / DX */
    .split-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 12px;
      text-align: center;
    }

    .stat-label {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .stat-value {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--text-main);
      margin-top: 4px;
    }

    /* Card Storico Giri */
    .history-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .history-table-container {
      max-height: 250px;
      overflow-y: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.85rem;
    }

    th {
      color: var(--text-muted);
      font-size: 0.7rem;
      text-transform: uppercase;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-color);
    }

    td {
      padding: 8px 0;
      border-bottom: 1px solid rgba(39, 39, 42, 0.5);
      font-variant-numeric: tabular-nums;
    }

    .empty-row td {
      text-align: center;
      color: var(--text-muted);
      padding: 16px 0;
    }

    .history-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 4px;
    }

    /* Control Panel & Controls */
    .control-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .input-wrapper {
      display: flex;
      gap: 8px;
    }

    input[type="text"] {
      flex: 1;
      background: #000;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 10px;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--accent-color);
    }

    /* Console Log */
    .log-card {
      background: #000;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 10px;
      font-family: monospace;
      font-size: 0.7rem;
      color: var(--success);
      height: 85px;
      overflow-y: auto;
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <header>
      <h1>DisplayWolf</h1>
      <div class="header-actions">
        <button class="btn-icon" onclick="toggleFullscreen()">⛶ Fullscreen</button>
        <div class="status-badge">
          <div id="status-dot" class="status-dot"></div>
          <span id="status-text">Disconnesso</span>
        </div>
      </div>
    </header>

    <div class="btn-group">
      <button id="btn-connect" onclick="connectBLE()">Connetti BLE</button>
      <button id="btn-disconnect" onclick="disconnectBLE()" class="btn-danger" disabled>Disconnetti</button>
    </div>

    <div class="lap-stats">
      <div class="lap-card">
        <div class="lap-label">Last Lap</div>
        <div id="last-lap" class="lap-value">--:--.--</div>
      </div>
      <div class="lap-card best">
        <div class="lap-label">Best Lap</div>
        <div id="best-lap" class="lap-value">--:--.--</div>
      </div>
    </div>

    <div class="gauge-card">
      <div class="gauge-title">Inclinazione Corrente</div>
      <div class="visual-gauge-container">
        <div class="gauge-arc-bg"></div>
        <div id="gauge-needle" class="gauge-needle"></div>
        <div class="gauge-center-dot"></div>
      </div>
      <div class="gauge-value-container">
        <span id="lean-value" class="gauge-value">0</span>
        <span class="gauge-unit">°</span>
      </div>
    </div>

    <div class="split-stats">
      <div class="stat-card">
        <div class="stat-label">Max Sinistra (SX)</div>
        <div class="stat-value"><span id="max-left">0</span>°</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Max Destra (DX)</div>
        <div class="stat-value"><span id="max-right">0</span>°</div>
      </div>
    </div>

    <div class="history-card">
      <div class="gauge-title">Storico Ultimi Giri (Max 30)</div>
      <div class="history-table-container">
