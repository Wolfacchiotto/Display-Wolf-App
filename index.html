<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DisplayWolf Dashboard Pro</title>

  <style>
    :root {
      --bg-color: #09090b;
      --card-bg: #18181b;
      --accent-color: #0284c7;
      --accent-glow: #38bdf8;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --danger: #ef4444;
      --success: #22c55e;
      --border-color: #27272a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      padding: 15px 10px;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    header {
      background: var(--card-bg);
      padding: 14px 16px;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--text-main);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      background: #000;
      padding: 6px 10px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--danger);
      box-shadow: 0 0 8px var(--danger);
    }

    .status-dot.connected {
      background-color: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    .status-dot.reconnecting {
      background-color: #f59e0b;
      box-shadow: 0 0 8px #f59e0b;
    }

    .btn-icon {
      background: #27272a;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 0.8rem;
      color: var(--text-main);
      cursor: pointer;
    }

    .btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      background: var(--accent-color);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      background: var(--border-color);
      color: var(--text-muted);
      cursor: not-allowed;
      transform: none;
    }

    .btn-danger {
      background: #3f3f46;
      color: var(--text-main);
    }

    .btn-reset {
      background: #3f3f46;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      width: 100%;
      margin-top: 6px;
    }

    .btn-save {
      background: var(--accent-color);
      color: #fff;
      border: 1px solid var(--accent-glow);
      width: 100%;
      margin-top: 6px;
    }

    .lap-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;
    }

    .lap-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 12px;
      text-align: center;
      position: relative;
    }

    .lap-card.best {
      border-color: rgba(34, 197, 94, 0.4);
      background: linear-gradient(180deg, rgba(34, 197, 94, 0.05) 0%, var(--card-bg) 100%);
    }

    .lap-label {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .lap-card.best .lap-label {
      color: var(--success);
    }

    .lap-value {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text-main);
      margin-top: 4px;
      font-variant-numeric: tabular-nums;
    }

    .lap-card.best .lap-value {
      color: var(--success);
    }

    .gauge-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 20px 16px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .gauge-title {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .visual-gauge-container {
      position: relative;
      width: 200px;
      height: 110px;
      margin-top: 10px;
    }

    .gauge-arc-bg {
      width: 200px;
      height: 100px;
      border-top-left-radius: 100px;
      border-top-right-radius: 100px;
      border: 12px solid #27272a;
      border-bottom: none;
      box-sizing: border-box;
    }

    .gauge-needle {
      position: absolute;
      bottom: 10px;
      left: 50%;
      width: 4px;
      height: 80px;
      background: var(--accent-glow);
      border-radius: 2px;
      transform-origin: bottom center;
      transform: translateX(-50%) rotate(0deg);
      transition: transform 0.15s cubic-bezier(0.1, 0.9, 0.2, 1);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .gauge-center-dot {
      position: absolute;
      bottom: 2px;
      left: 50%;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--text-main);
      transform: translateX(-50%);
    }

    .gauge-value-container {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 2px;
      margin-top: 5px;
    }

    .gauge-value {
      font-size: 3.8rem;
      font-weight: 900;
      color: var(--accent-glow);
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .gauge-unit {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--accent-glow);
    }

    .split-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 12px;
      text-align: center;
    }

    .stat-label {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .stat-value {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--text-main);
      margin-top: 4px;
    }

    .history-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .history-table-container {
      max-height: 200px;
      overflow-y: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.85rem;
    }

    th {
      color: var(--text-muted);
      font-size: 0.7rem;
      text-transform: uppercase;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-color);
    }

    td {
      padding: 8px 0;
      border-bottom: 1px solid rgba(39, 39, 42, 0.5);
      font-variant-numeric: tabular-nums;
    }

    .empty-row td {
      text-align: center;
      color: var(--text-muted);
      padding: 16px 0;
    }

    .control-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .input-wrapper {
      display: flex;
      gap: 8px;
    }

    input[type="text"] {
      flex: 1;
      background: #000;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 10px;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
    }

    .log-card {
      background: #000;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 10px;
      font-family: monospace;
      font-size: 0.7rem;
      color: var(--success);
      height: 85px;
      overflow-y: auto;
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <header>
      <h1>DisplayWolf</h1>
      <div class="header-actions">
        <button class="btn-icon" onclick="toggleFullscreen()">⛶ Fullscreen</button>
        <div class="status-badge">
          <div id="status-dot" class="status-dot"></div>
          <span id="status-text">Disconnesso</span>
        </div>
      </div>
    </header>

    <div class="btn-group">
      <button id="btn-connect" onclick="connectBLE()">Connetti BLE</button>
      <button id="btn-disconnect" onclick="disconnectBLE()" class="btn-danger" disabled>Disconnetti</button>
    </div>

    <div class="lap-stats">
      <div class="lap-card">
        <div class="lap-label">Last Lap</div>
        <div id="last-lap" class="lap-value">--:--.--</div>
      </div>
      <div class="lap-card best">
        <div class="lap-label">Best Lap</div>
        <div id="best-lap" class="lap-value">--:--.--</div>
      </div>
    </div>

    <div class="gauge-card">
      <div class="gauge-title">Inclinazione Corrente</div>
      <div class="visual-gauge-container">
        <div class="gauge-arc-bg"></div>
        <div id="gauge-needle" class="gauge-needle"></div>
        <div class="gauge-center-dot"></div>
      </div>
      <div class="gauge-value-container">
        <span id="lean-value" class="gauge-value">0</span>
        <span class="gauge-unit">°</span>
      </div>
    </div>

    <div class="split-stats">
      <div class="stat-card">
        <div class="stat-label">Max Sinistra (SX)</div>
        <div class="stat-value"><span id="max-left">0</span>°</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Max Destra (DX)</div>
        <div class="stat-value"><span id="max-right">0</span>°</div>
      </div>
    </div>

    <div class="history-card">
      <div class="gauge-title">Storico Ultimi Giri</div>
      <div class="history-table-container">
        <table id="laps-history-table">
          <thead>
            <tr>
              <th>Giro</th>
              <th>Tempo</th>
            </tr>
          </thead>
          <tbody>
            <tr class="empty-row"><td colspan="2">Nessun giro registrato</td></tr>
          </tbody>
        </table>
      </div>
      <button class="btn-reset" onclick="resetHistory()">Reset Storico</button>
      <button class="btn-save" onclick="downloadReportTxt()">Salva Report (TXT)</button>
    </div>

    <div class="control-card">
      <div class="gauge-title">Invia Comando</div>
      <div class="input-wrapper">
        <input type="text" id="cmd-input" placeholder="Invia comando..." disabled />
        <button id="btn-send" onclick="sendCommand()" disabled>Invia</button>
      </div>
    </div>

    <div id="log-output" class="log-card">In attesa della connessione...</div>

  </div>

  <!-- Modal Report -->
  <div id="report-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:999; align-items:center; justify-content:center; padding:15px;">
    <div style="background:var(--card-bg); border:1px solid var(--border-color); border-radius:16px; padding:16px; width:100%; max-width:400px; display:flex; flex-direction:column; gap:12px;">
      <h3 style="color:var(--text-main); font-size:1rem; text-align:center;">Report Telemetria</h3>
      <textarea id="modal-report-text" readonly style="width:100%; height:220px; background:#000; color:var(--success); font-family:monospace; font-size:0.75rem; border:1px solid var(--border-color); border-radius:10px; padding:10px; resize:none;"></textarea>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
        <button onclick="copyReportToClipboard()" style="background:var(--accent-color);">Copia Testo</button>
        <button onclick="closeModal()" class="btn-danger">Chiudi</button>
      </div>
    </div>
  </div>

  <script>
    const SERVICE_UUID    = '12345678-1234-1234-1234-123456789abc';
    const CHAR_READ_UUID  = '87654321-4321-4321-4321-cba987654321'; 
    const CHAR_WRITE_UUID = '87654321-4321-4321-4321-cba987654321';

    let bleDevice = null;
    let writeChar = null;
    let isAutoReconnecting = false;

    let maxLeft = 0;
    let maxRight = 0;
    let lapsHistory = [];

    function log(text) {
      const logEl = document.getElementById('log-output');
      logEl.innerText += '\n> ' + text;
      logEl.scrollTop = logEl.scrollHeight;
    }

    function addLapToHistory(lapTimeString) {
      if (!lapTimeString || lapTimeString === "--:--.--" || lapTimeString === "00:00.000") return;

      if (lapsHistory.length > 0 && lapsHistory[0] === lapTimeString) {
        return;
      }

      lapsHistory.unshift(lapTimeString);

      if (lapsHistory.length > 30) {
        lapsHistory.pop();
      }

      updateLapsHistoryUI();
      saveLocalData();
    }

    function updateLapsHistoryUI() {
      const tbody = document.querySelector('#laps-history-table tbody');
      if (!tbody) return;

      if (lapsHistory.length === 0) {
        tbody.innerHTML = '<tr class="empty-row"><td colspan="2">Nessun giro registrato</td></tr>';
        return;
      }

      let html = '';
      lapsHistory.forEach((lap, index) => {
        const lapNumber = lapsHistory.length - index;
        html += `<tr>
          <td>Giro ${lapNumber}</td>
          <td><strong>${lap}</strong></td>
        </tr>`;
      });
      tbody.innerHTML = html;
    }

    function resetHistory() {
      lapsHistory = [];
      updateLapsHistoryUI();
      saveLocalData();
      log("Storico giri azzerato.");
    }

    function downloadReportTxt() {
  try {
    const now = new Date();
    const dateStr = now.toLocaleDateString('it-IT', {
      day: '2-digit',
      month: '2-digit',
      year: 'numeric'
    });
    const timeStr = now.toLocaleTimeString('it-IT', {
      hour: '2-digit',
      minute: '2-digit'
    });

    const bestLap = document.getElementById('best-lap').innerText;
    const lastLap = document.getElementById('last-lap').innerText;

    let content = `🏁 DISPLAYWOLF TELEMETRY REPORT\n`;
    content += `📅 ${dateStr}   |   🕒 ${timeStr}\n\n`;
    content += `========================================\n\n`;
    
    content += `📊 RIEPILOGO PRESTAZIONI\n\n`;
    content += `  🏆 Best Lap   :  ${bestLap}\n\n`;
    content += `  ⏱️ Last Lap   :  ${lastLap}\n\n`;
    content += `  📐 Max SX     :  ${maxLeft}°\n\n`;
    content += `  📐 Max DX     :  ${maxRight}°\n\n`;

    content += `========================================\n\n`;
    content += `📋 STORICO GIRI (${lapsHistory.length})\n\n`;

    if (lapsHistory.length === 0) {
      content += `  Nessun giro registrato.\n\n`;
    } else {
      lapsHistory.forEach((lap, index) => {
        const lapNum = (lapsHistory.length - index).toString().padStart(2, '0');
        const isBest = (lap === bestLap && bestLap !== '--:--.--') ? ' ⭐ (BEST)' : '';
        content += `  • Giro ${lapNum}   ──>   ${lap}${isBest}\n\n`;
      });
    }

    content += `========================================\n`;

    // Mostra a schermo nel modal
    document.getElementById('modal-report-text').value = content;
    document.getElementById('report-modal').style.display = 'flex';

    log("Report generato a schermo!");
  } catch (err) {
    log("Errore generazione report: " + err.message);
  }
}

    function copyReportToClipboard() {
  const textarea = document.getElementById('modal-report-text');

  try {
    // 1. Seleziona il testo all'interno della textarea
    textarea.focus();
    textarea.select();
    textarea.setSelectionRange(0, 99999); // Importante per dispositivi mobili / iOS

    // 2. Prova prima con la Clipboard API moderna
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(textarea.value).then(() => {
        alert("Report copiato negli appunti!");
      }).catch(() => {
        // Fallback manuale in caso di errore dell'API
        fallbackCopy(textarea);
      });
    } else {
      // 3. Fallback classico per browser vecchi o connessioni non HTTPS
      fallbackCopy(textarea);
    }
  } catch (err) {
    log("Errore nella copia negli appunti: " + err.message);
  }
}

function fallbackCopy(textareaElement) {
  try {
    const successful = document.execCommand('copy');
    if (successful) {
      alert("Report copiato negli appunti!");
    } else {
      alert("Impossibile copiare automaticamente. Seleziona il testo e copialo manualmente.");
    }
  } catch (err) {
    alert("Errore nella copia. Seleziona il testo e copialo manualmente.");
  }
}

    function closeModal() {
      document.getElementById('report-modal').style.display = 'none';
    }

    async function connectBLE() {
      if (!navigator.bluetooth) {
        alert("Web Bluetooth non è supportato su questo browser.");
        return;
      }

      try {
        log("Ricerca del dispositivo...");
        bleDevice = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [SERVICE_UUID]
        });

        bleDevice.addEventListener('gattserverdisconnected', onDisconnected);
        await performConnection();

      } catch (err) {
        log("Errore: " + err.message);
      }
    }

    async function performConnection() {
      try {
        log("Connessione in corso a " + bleDevice.name + "...");
        const server = await bleDevice.gatt.connect();

        const service = await server.getPrimaryService(SERVICE_UUID);

        const readChar = await service.getCharacteristic(CHAR_READ_UUID);
        await readChar.startNotifications();
        readChar.addEventListener('characteristicvaluechanged', handleDataReceived);

        writeChar = await service.getCharacteristic(CHAR_WRITE_UUID);

        isAutoReconnecting = false;
        setUIConnected(true);
        log("Connesso con successo!");
      } catch (err) {
        log("Connessione fallita: " + err.message);
        if (isAutoReconnecting) {
          setTimeout(performConnection, 3000);
        }
      }
    }

    function handleDataReceived(event) {
      const decoder = new TextDecoder('utf-8');
      const rawData = decoder.decode(event.target.value).trim();
      log("Ricevuto: " + rawData);

      try {
        const data = JSON.parse(rawData);

        if (data.maxDX !== undefined) {
          maxRight = data.maxDX;
          document.getElementById('max-right').innerText = maxRight;
        }
        if (data.maxSX !== undefined) {
          maxLeft = data.maxSX;
          document.getElementById('max-left').innerText = maxLeft;
        }

        if (data.lastLap) {
          document.getElementById('last-lap').innerText = data.lastLap;
          addLapToHistory(data.lastLap);
        }
        if (data.bestLap) {
          document.getElementById('best-lap').innerText = data.bestLap;
        }

        if (data.lean !== undefined) {
          updateGauge(data.lean);
        }

        saveLocalData();
        return;
      } catch (e) {
      }

      if (rawData.startsWith("LAP:")) {
        const timeStr = rawData.replace("LAP:", "");
        document.getElementById('last-lap').innerText = timeStr;
        addLapToHistory(timeStr);
        log("Giro ricevuto: " + timeStr);
        return;
      }

      const parsedValue = parseFloat(rawData);
      if (!isNaN(parsedValue)) {
        updateGauge(parsedValue);
      }
    }

    function updateGauge(val) {
      document.getElementById('lean-value').innerText = Math.abs(val);

      const clamped = Math.max(-60, Math.min(60, val));
      document.getElementById('gauge-needle').style.transform = `translateX(-50%) rotate(${clamped}deg)`;

      if (val < 0 && Math.abs(val) > maxLeft) {
        maxLeft = Math.abs(val);
        document.getElementById('max-left').innerText = maxLeft;
        saveLocalData();
      } else if (val > 0 && val > maxRight) {
        maxRight = val;
        document.getElementById('max-right').innerText = maxRight;
        saveLocalData();
      }
    }

    async function sendCommand() {
      const input = document.getElementById('cmd-input');
      if (input.value && writeChar) {
        try {
          const encoder = new TextEncoder();
          await writeChar.writeValue(encoder.encode(input.value));
          log("Inviato: " + input.value);
          input.value = '';
        } catch (err) {
          log("Errore invio: " + err.message);
        }
      }
    }

    async function disconnectBLE() {
      isAutoReconnecting = false;
      if (bleDevice && bleDevice.gatt.connected) {
        bleDevice.gatt.disconnect();
      }
    }

    function onDisconnected() {
      setUIConnected(false);
      log("Connessione persa.");

      if (bleDevice) {
        isAutoReconnecting = true;
        document.getElementById('status-dot').className = 'status-dot reconnecting';
        document.getElementById('status-text').innerText = 'Riconnessione...';
        log("Tentativo di auto-riconnessione in corso...");
        setTimeout(performConnection, 2000);
      }
    }

    function setUIConnected(connected) {
      document.getElementById('status-dot').className = connected ? 'status-dot connected' : 'status-dot';
      document.getElementById('status-text').innerText = connected ? 'Connesso' : 'Disconnesso';

      document.getElementById('btn-connect').disabled = connected;
      document.getElementById('btn-disconnect').disabled = !connected;
      document.getElementById('cmd-input').disabled = !connected;
      document.getElementById('btn-send').disabled = !connected;

      if (!connected && !isAutoReconnecting) {
        document.getElementById('lean-value').innerText = '0';
        document.getElementById('gauge-needle').style.transform = 'translateX(-50%) rotate(0deg)';
      }
    }

    function saveLocalData() {
      localStorage.setItem('displaywolf_data', JSON.stringify({
        left: maxLeft,
        right: maxRight,
        bestLap: document.getElementById('best-lap').innerText,
        lastLap: document.getElementById('last-lap').innerText,
        lapsHistory: lapsHistory
      }));
    }

    function loadLocalData() {
      const saved = localStorage.getItem('displaywolf_data');
      if (saved) {
        const parsed = JSON.parse(saved);
        maxLeft = parsed.left || 0;
        maxRight = parsed.right || 0;
        lapsHistory = parsed.lapsHistory || [];

        document.getElementById('max-left').innerText = maxLeft;
        document.getElementById('max-right').innerText = maxRight;
        if (parsed.lastLap) document.getElementById('last-lap').innerText = parsed.lastLap;
        if (parsed.bestLap) document.getElementById('best-lap').innerText = parsed.bestLap;

        updateLapsHistoryUI();
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    loadLocalData();
  </script>
</body>
</html>
