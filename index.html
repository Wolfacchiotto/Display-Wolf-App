<<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DisplayWolf Dashboard Pro</title>
  <!-- Chart.js per il grafico in tempo reale -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-color: #09090b;
      --card-bg: #18181b;
      --accent-color: #0284c7;
      --accent-glow: #38bdf8;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --danger: #ef4444;
      --success: #22c55e;
      --border-color: #27272a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      padding: 15px 10px;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Header e Stato */
    header {
      background: var(--card-bg);
      padding: 14px 16px;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--text-main);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      background: #000;
      padding: 6px 10px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--danger);
      box-shadow: 0 0 8px var(--danger);
    }

    .status-dot.connected {
      background-color: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    .status-dot.reconnecting {
      background-color: #f59e0b;
      box-shadow: 0 0 8px #f59e0b;
    }

    .btn-icon {
      background: #27272a;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 0.8rem;
      color: var(--text-main);
      cursor: pointer;
    }

    /* Pulsanti di Connessione */
    .btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      background: var(--accent-color);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      background: var(--border-color);
      color: var(--text-muted);
      cursor: not-allowed;
      transform: none;
    }

    .btn-danger {
      background: #3f3f46;
      color: var(--text-main);
    }

    /* Sezione Lap Timer (Best / Last Lap) */
    .lap-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;
    }

    .lap-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 12px;
      text-align: center;
      position: relative;
    }

    .lap-card.best {
      border-color: rgba(34, 197, 94, 0.4);
      background: linear-gradient(180deg, rgba(34, 197, 94, 0.05) 0%, var(--card-bg) 100%);
    }

    .lap-label {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .lap-card.best .lap-label {
      color: var(--success);
    }

    .lap-value {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text-main);
      margin-top: 4px;
      font-variant-numeric: tabular-nums;
    }

    .lap-card.best .lap-value {
      color: var(--success);
    }

    /* Card Angolo di Piega Visuale */
    .gauge-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 20px 16px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .gauge-title {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .visual-gauge-container {
      position: relative;
      width: 200px;
      height: 110px;
      margin-top: 10px;
    }

    .gauge-arc-bg {
      width: 200px;
      height: 100px;
      border-top-left-radius: 100px;
      border-top-right-radius: 100px;
      border: 12px solid #27272a;
      border-bottom: none;
      box-sizing: border-box;
    }

    .gauge-needle {
      position: absolute;
      bottom: 10px;
      left: 50%;
      width: 4px;
      height: 80px;
      background: var(--accent-glow);
      border-radius: 2px;
      transform-origin: bottom center;
      transform: translateX(-50%) rotate(0deg);
      transition: transform 0.15s cubic-bezier(0.1, 0.9, 0.2, 1);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .gauge-center-dot {
      position: absolute;
      bottom: 2px;
      left: 50%;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--text-main);
      transform: translateX(-50%);
    }

    .gauge-value-container {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 2px;
      margin-top: 5px;
    }

    .gauge-value {
      font-size: 3.8rem;
      font-weight: 900;
      color: var(--accent-glow);
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .gauge-unit {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--accent-glow);
    }

    /* Sezione Max SX / DX */
    .split-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 12px;
      text-align: center;
    }

    .stat-label {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .stat-value {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--text-main);
      margin-top: 4px;
    }

    /* Grafico Card */
    .chart-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 14px;
      height: 180px;
    }

    /* Control Panel & Controls */
    .control-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .input-wrapper {
      display: flex;
      gap: 8px;
    }

    input[type="text"] {
      flex: 1;
      background: #000;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 10px;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--accent-color);
    }

    .quick-actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .btn-quick {
      background: #27272a;
      border: 1px solid var(--border-color);
      font-size: 0.75rem;
      padding: 8px;
    }

    .session-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    /* Console Log */
    .log-card {
      background: #000;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 10px;
      font-family: monospace;
      font-size: 0.7rem;
      color: var(--success);
      height: 85px;
      overflow-y: auto;
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- Header -->
    <header>
      <h1>DisplayWolf</h1>
      <div class="header-actions">
        <button class="btn-icon" onclick="toggleFullscreen()">⛶ Fullscreen</button>
        <div class="status-badge">
          <div id="status-dot" class="status-dot"></div>
          <span id="status-text">Disconnesso</span>
        </div>
      </div>
    </header>

    <!-- Connessione -->
    <div class="btn-group">
      <button id="btn-connect" onclick="connectBLE()">Connetti BLE</button>
      <button id="btn-disconnect" onclick="disconnectBLE()" class="btn-danger" disabled>Disconnetti</button>
    </div>

    <!-- Sezione Lap Timer -->
    <div class="lap-stats">
      <div class="lap-card">
        <div class="lap-label">Last Lap</div>
        <div id="last-lap" class="lap-value">--:--.--</div>
      </div>
      <div class="lap-card best">
        <div class="lap-label">Best Lap</div>
        <div id="best-lap" class="lap-value">--:--.--</div>
      </div>
    </div>

    <!-- Indicatore Visuale Piega Istantanea -->
    <div class="gauge-card">
      <div class="gauge-title">Inclinazione Corrente</div>
      <div class="visual-gauge-container">
        <div class="gauge-arc-bg"></div>
        <div id="gauge-needle" class="gauge-needle"></div>
        <div class="gauge-center-dot"></div>
      </div>
      <div class="gauge-value-container">
        <span id="lean-value" class="gauge-value">0</span>
        <span class="gauge-unit">°</span>
      </div>
    </div>

    <!-- Massimi SX / DX -->
    <div class="split-stats">
      <div class="stat-card">
        <div class="stat-label">Max Sinistra (SX)</div>
        <div class="stat-value"><span id="max-left">0</span>°</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Max Destra (DX)</div>
        <div class="stat-value"><span id="max-right">0</span>°</div>
      </div>
    </div>

    <!-- Grafico In Real-Time -->
    <div class="chart-card">
      <canvas id="leanChart"></canvas>
    </div>

    <!-- Invio Parametri e Comandi -->
    <div class="control-card">
      <div class="gauge-title">Invia Comando</div>
      <div class="input-wrapper">
        <input type="text" id="cmd-input" placeholder="Es. LAP, RESET, SET:45..." disabled />
        <button id="btn-send" onclick="sendCommand()" disabled>Invia</button>
      </div>
      
      <div class="quick-actions">
        <button class="btn-quick" onclick="triggerManualLap()" id="btn-lap">⏱️ Nuovo Giro</button>
        <button class="btn-quick" onclick="sendQuickCmd('RESET')" disabled>Reset Piega</button>
        <button class="btn-quick" onclick="sendQuickCmd('GET_DATA')" disabled>Scarica Dati</button>
      </div>

      <div class="session-actions">
        <button class="btn-quick" onclick="resetMaxValues()">Azzera Dati</button>
        <button class="btn-quick" onclick="exportCSV()">Esporta CSV</button>
      </div>
    </div>

    <!-- Terminale Log -->
    <div id="log-output" class="log-card">In attesa della connessione...</div>

  </div>

  <script>
    // UUID DisplayWolf
    const SERVICE_UUID    = '12345678-1234-1234-1234-123456789abc';
    const CHAR_READ_UUID  = '87654321-4321-4321-4321-cba987654321'; 
    const CHAR_WRITE_UUID = '87654321-4321-4321-4321-cba987654321';

    let bleDevice = null;
    let writeChar = null;
    let isAutoReconnecting = false;

    let maxLeft = 0;
    let maxRight = 0;
    let lastLapTime = null; // in ms
    let bestLapTime = null; // in ms
    let lapStartTime = Date.now();
    let lapHistory = [];

    let sessionHistory = []; // { timestamp, value }

    // Inizializzazione Grafico Chart.js
    const ctx = document.getElementById('leanChart').getContext('2d');
    const leanChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: [],
        datasets: [{
          label: 'Angolo Piega (°)',
          data: [],
          borderColor: '#38bdf8',
          borderWidth: 2,
          pointRadius: 0,
          tension: 0.3,
          fill: true,
          backgroundColor: 'rgba(56, 189, 248, 0.1)'
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          x: { display: false },
          y: {
            min: -60,
            max: 60,
            grid: { color: '#27272a' },
            ticks: { color: '#a1a1aa', font: { size: 10 } }
          }
        },
        plugins: { legend: { display: false } },
        animation: false
      }
    });

    function log(text) {
      const logEl = document.getElementById('log-output');
      logEl.innerText += '\n> ' + text;
      logEl.scrollTop = logEl.scrollHeight;
    }

    function formatTime(ms) {
      if (!ms) return "--:--.--";
      const totalSec = ms / 1000;
      const min = Math.floor(totalSec / 60);
      const sec = Math.floor(totalSec % 60);
      const millis = Math.floor((ms % 1000) / 10);
      
      const pad = (n) => (n < 10 ? "0" + n : n);
      return `${pad(min)}:${pad(sec)}.${pad(millis)}`;
    }

    function recordLap(msTime) {
      if (!msTime || msTime < 5000) return; // Ignora se sotto i 5 secondi

      lastLapTime = msTime;
      document.getElementById('last-lap').innerText = formatTime(lastLapTime);

      if (!bestLapTime || lastLapTime < bestLapTime) {
        bestLapTime = lastLapTime;
        document.getElementById('best-lap').innerText = formatTime(bestLapTime);
        log(" nuovo BEST LAP: " + formatTime(bestLapTime));
      } else {
        log("Giro completato: " + formatTime(lastLapTime));
      }

      lapHistory.push({ lap: lapHistory.length + 1, time: formatTime(lastLapTime), ms: lastLapTime });
      saveLocalData();
    }

    function triggerManualLap() {
      const now = Date.now();
      const elapsed = now - lapStartTime;
      recordLap(elapsed);
      lapStartTime = now;
      sendQuickCmd('LAP');
    }

    async function connectBLE() {
      if (!navigator.bluetooth) {
        alert("Web Bluetooth non è supportato. Su iOS usa l'app Bluefy!");
        return;
      }

      try {
        log("Ricerca del dispositivo...");
        bleDevice = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [SERVICE_UUID]
        });

        bleDevice.addEventListener('gattserverdisconnected', onDisconnected);
        await performConnection();

      } catch (err) {
        log("Errore: " + err.message);
      }
    }

    async function performConnection() {
      try {
        log("Connessione in corso a " + bleDevice.name + "...");
        const server = await bleDevice.gatt.connect();

        log("Ottengo il servizio...");
        const service = await server.getPrimaryService(SERVICE_UUID);

        const readChar = await service.getCharacteristic(CHAR_READ_UUID);
        await readChar.startNotifications();
        readChar.addEventListener('characteristicvaluechanged', handleDataReceived);

        writeChar = await service.getCharacteristic(CHAR_WRITE_UUID);

        isAutoReconnecting = false;
        setUIConnected(true);
        lapStartTime = Date.now();
        log("Connesso con successo!");
      } catch (err) {
        log("Connessione fallita: " + err.message);
        if (isAutoReconnecting) {
          setTimeout(performConnection, 3000);
        }
      }
    }

  function handleDataReceived(event) {
  const decoder = new TextDecoder('utf-8');
  const rawData = decoder.decode(event.target.value).trim();
  log("Ricevuto: " + rawData);

  // 1. Prova prima a fare il parse come JSON
  try {
    const data = JSON.parse(rawData);

    // Gestione Max DX e Max SX
    if (data.maxDX !== undefined) {
      maxRight = data.maxDX;
      document.getElementById('max-right').innerText = maxRight;
    }
    if (data.maxSX !== undefined) {
      maxLeft = data.maxSX;
      document.getElementById('max-left').innerText = maxLeft;
    }

    // Gestione Tempi sul Giro (lastLap e bestLap)
    if (data.lastLap) {
      document.getElementById('last-lap').innerText = data.lastLap;
    }
    if (data.bestLap) {
      document.getElementById('best-lap').innerText = data.bestLap;
    }

    // Gestione Inclinazione/Piega Istantanea (se inviata nel JSON, es. "lean")
    if (data.lean !== undefined) {
      updateGauge(data.lean);
      processLeanData(data.lean);
    }

    saveLocalData();
    return; // Se è un JSON valido, l'elaborazione finisce qui
  } catch (e) {
    // Se non è un JSON, prosegui con i controlli per stringhe semplici
  }

  // 2. Gestione dei messaggi legacy o comandi singoli
  if (rawData.startsWith("LAPMS:")) {
    const ms = parseInt(rawData.replace("LAPMS:", ""));
    recordLap(ms);
    return;
  } else if (rawData.startsWith("LAP:")) {
    const timeStr = rawData.replace("LAP:", "");
    document.getElementById('last-lap').innerText = timeStr;
    log("Giro ricevuto: " + timeStr);
    return;
  }

  // 3. Fallback per valore numerico singolo dell'inclinazione
  const parsedValue = parseFloat(rawData);
  if (!isNaN(parsedValue)) {
    updateGauge(parsedValue);
    processLeanData(parsedValue);
  }
}

    function updateGauge(val) {
      document.getElementById('lean-value').innerText = Math.abs(val);

      const clamped = Math.max(-60, Math.min(60, val));
      document.getElementById('gauge-needle').style.transform = `translateX(-50%) rotate(${clamped}deg)`;

      if (val < 0 && Math.abs(val) > maxLeft) {
        maxLeft = Math.abs(val);
        document.getElementById('max-left').innerText = maxLeft;
        saveLocalData();
      } else if (val > 0 && val > maxRight) {
        maxRight = val;
        document.getElementById('max-right').innerText = maxRight;
        saveLocalData();
      }
    }

    function processLeanData(val) {
      const now = new Date().toLocaleTimeString();
      sessionHistory.push({ time: now, value: val });

      leanChart.data.labels.push(now);
      leanChart.data.datasets[0].data.push(val);

      if (leanChart.data.labels.length > 30) {
        leanChart.data.labels.shift();
        leanChart.data.datasets[0].data.shift();
      }
      leanChart.update();
    }

    async function sendCommand() {
      const input = document.getElementById('cmd-input');
      if (input.value) {
        await sendQuickCmd(input.value);
        input.value = '';
      }
    }

    async function sendQuickCmd(cmdStr) {
      if (!writeChar) return;
      try {
        const encoder = new TextEncoder();
        await writeChar.writeValue(encoder.encode(cmdStr));
        log("Inviato: " + cmdStr);
      } catch (err) {
        log("Errore invio: " + err.message);
      }
    }

    async function disconnectBLE() {
      isAutoReconnecting = false;
      if (bleDevice && bleDevice.gatt.connected) {
        bleDevice.gatt.disconnect();
      }
    }

    function onDisconnected() {
      setUIConnected(false);
      log("Connessione persa.");

      if (bleDevice) {
        isAutoReconnecting = true;
        document.getElementById('status-dot').className = 'status-dot reconnecting';
        document.getElementById('status-text').innerText = 'Riconnessione...';
        log("Tentativo di auto-riconnessione in corso...");
        setTimeout(performConnection, 2000);
      }
    }

    function setUIConnected(connected) {
      document.getElementById('status-dot').className = connected ? 'status-dot connected' : 'status-dot';
      document.getElementById('status-text').innerText = connected ? 'Connesso' : 'Disconnesso';

      document.getElementById('btn-connect').disabled = connected;
      document.getElementById('btn-disconnect').disabled = !connected;
      document.getElementById('cmd-input').disabled = !connected;
      document.getElementById('btn-send').disabled = !connected;

      const quickBtns = document.querySelectorAll('.quick-actions button');
      quickBtns.forEach(btn => btn.disabled = !connected);

      if (!connected && !isAutoReconnecting) {
        document.getElementById('lean-value').innerText = '0';
        document.getElementById('gauge-needle').style.transform = 'translateX(-50%) rotate(0deg)';
      }
    }

    function resetMaxValues() {
      maxLeft = 0;
      maxRight = 0;
      lastLapTime = null;
      bestLapTime = null;
      lapHistory = [];
      document.getElementById('max-left').innerText = '0';
      document.getElementById('max-right').innerText = '0';
      document.getElementById('last-lap').innerText = '--:--.--';
      document.getElementById('best-lap').innerText = '--:--.--';
      localStorage.removeItem('displaywolf_data');
      log("Tutti i dati azzerati.");
    }

    function saveLocalData() {
      localStorage.setItem('displaywolf_data', JSON.stringify({
        left: maxLeft,
        right: maxRight,
        bestLap: bestLapTime,
        lastLap: lastLapTime,
        history: lapHistory
      }));
    }

    function loadLocalData() {
      const saved = localStorage.getItem('displaywolf_data');
      if (saved) {
        const parsed = JSON.parse(saved);
        maxLeft = parsed.left || 0;
        maxRight = parsed.right || 0;
        bestLapTime = parsed.bestLap || null;
        lastLapTime = parsed.lastLap || null;
        lapHistory = parsed.history || [];

        document.getElementById('max-left').innerText = maxLeft;
        document.getElementById('max-right').innerText = maxRight;
        document.getElementById('last-lap').innerText = formatTime(lastLapTime);
        document.getElementById('best-lap').innerText = formatTime(bestLapTime);
      }
    }

    function exportCSV() {
      if (sessionHistory.length === 0 && lapHistory.length === 0) {
        alert("Nessun dato registrato nella sessione corrente.");
        return;
      }
      
      let csvContent = "data:text/csv;charset=utf-8,--- TEMPI SUL GIRO ---\nGiro,Tempo\n";
      lapHistory.forEach(l => {
        csvContent += `${l.lap},${l.time}\n`;
      });

      csvContent += "\n--- ANGOLI DI PIEGA ---\nOra,Angolo_Piega\n";
      sessionHistory.forEach(row => {
        csvContent += `${row.time},${row.value}\n`;
      });

      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `displaywolf_session_${Date.now()}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      log("File CSV esportato.");
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    // Carica i dati salvati
    loadLocalData();
  </script>
</body>
</html>
